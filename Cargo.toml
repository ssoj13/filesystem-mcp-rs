[package]
name = "filesystem-mcp-rs"
version = "0.2.1"
edition = "2024"
description = "Rust port of the official MCP filesystem server - fast, safe, protocol-compatible file operations."
license = "MIT"
repository = "https://github.com/ssoj13/filesystem-mcp-rs"
homepage = "https://github.com/ssoj13/filesystem-mcp-rs"
keywords = ["mcp", "filesystem", "server", "protocol", "llm"]
categories = ["command-line-utilities", "filesystem"]
readme = "README.md"

[[bin]]
name = "filesystem-mcp-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive"] }
globset = "0.4.20"
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4.33"
rmcp = { version = "3.1.3", features = ["transport-io", "server", "macros", "transport-streamable-http-server"] }
axum = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
similar = "3.2.0"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = "2.5.8"
async-recursion = "1.1.1"
humantime = "2.4.0"
futures = "0.3.34"
schemars = { version = "1.2.2", features = ["derive"] }
regex = "1.13.1"
fancy-regex = "0.19"
chardetng = "1.0.0"
encoding_rs = "0.8"
reqwest = { version = "0.13", features = ["json", "stream", "blocking"] }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
xcap = { version = "0.9", optional = true }
arboard = { version = "3", optional = true }

# Computer-control optional deps (features ctl-*; see docs/computer_module.md).
windows = { version = "0.62", optional = true, features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    # WinRT OCR (ctl-ocr): Media_Ocr + imaging/streams/globalization.
    "Foundation",
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage_Streams",
    "Globalization",
] }
uiautomation = { version = "0.25", optional = true }
# Local neural OCR (pure Rust, RTen CPU inference) + model auto-download.
ocrs = { version = "0.13", optional = true }
rten = { version = "0.26", optional = true }
tauri-winrt-notification = { version = "0.7", optional = true }
clipboard-win = { version = "5.4", optional = true }

# Hashing
sha1 = "0.11"
sha2 = "0.11"
md-5 = "0.11"
xxhash-rust = { version = "0.8", features = ["xxh64"] }

# PDF
pdf-extract = "0.12"

# JSON query
serde_json_path = "0.7"

# Archives
zip = "8.6"
tar = "0.4"
flate2 = "1.1"

# File watching
notify = "8.2"

# Process management
sysinfo = "0.39"
tokio-util = "0.7"
aws-config = { version = "1.10.1", optional = true }
aws-sdk-s3 = { version = "1.142.0", optional = true }
aws-credential-types = { version = "1.3.0", optional = true }
aws-types = { version = "1.5.0", optional = true }

# XLSX reader
calamine = "0.36"

# DOCX reader
docx-lite = "0.2"

# LLM tools
uuid = { version = "1.24", features = ["v4", "serde"] }
time = { version = "0.3", features = ["formatting"] }
dotenvy = "0.15"
toml = "1.1"
thiserror = "2.0"

# Memory tools (scoped SQLite backend)
rusqlite = { version = "0.40", features = ["bundled"] }
# r2d2 provides the generic connection pool; the rusqlite-specific manager is
# our own `SqliteManager` in tools/memory_v2/sqlite.rs (was `r2d2_sqlite`, which
# pinned us to rusqlite ^0.39).
r2d2 = "0.8"
dirs = "6.0"

# Dependencies of the vendored `src/mcp_setup/` module (agent config files are JSONC / TOML and
# must be rewritten through a CST to preserve comments and formatting). See src/mcp_setup/VENDOR.md.
toml_edit = "0.25"
jsonc-parser = { version = "0.33.1", features = ["cst", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"
serial_test = "4.0"
rust_xlsxwriter = "0.98"

[features]
default = ["http-tools", "s3-tools", "screenshot-tools"]
http-tools = []
s3-tools = ["dep:aws-config", "dep:aws-sdk-s3", "dep:aws-credential-types", "dep:aws-types"]
screenshot-tools = ["dep:image", "dep:xcap", "dep:arboard"]

# Computer control (mouse/keyboard/windows/UIA/OCR) — self-contained module
# `src/tools/computer/`, extractable back into a standalone crate. Opt-in:
# NOT in default features. See docs/computer_module.md.
computer-tools = ["ctl-input", "ctl-uia", "ctl-ocr", "ctl-notify", "ctl-clip-files"]
# Input core: SendInput mouse/keys, arm gate, window mgmt, macro/wait, capture extensions.
# Pulls screenshot-tools for xcap/arboard (capture + paste-mode clipboard).
ctl-input = ["dep:windows", "screenshot-tools"]
# UI Automation (COM): ui/ui_click/ui_set. Requires ctl-input: the click
# fallback needs SendInput, and Invoke-only clicking is a broken half-state.
ctl-uia = ["ctl-input", "dep:uiautomation"]
# WinRT OCR (Windows.Media.Ocr): text + bbox find. Needs a capture source.
ctl-ocr = ["dep:windows", "dep:ocrs", "dep:rten", "screenshot-tools"]
# Toast notifications.
ctl-notify = ["dep:tauri-winrt-notification"]
# CF_HDROP clipboard file lists.
ctl-clip-files = ["dep:clipboard-win"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: filesystem-mcp-rs

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: filesystem-mcp-rs-linux-x86_64
          - os: macos-latest
            artifact: filesystem-mcp-rs-macos-aarch64
          - os: windows-latest
            artifact: filesystem-mcp-rs-windows-x86_64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb1-dev \
            libxrandr-dev \
            libx11-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libwayland-dev \
            libpipewire-0.3-dev \
            libegl-dev \
            libdrm-dev \
            libgbm-dev \
            libclang-dev

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test

      - name: Upload artifact (Linux/macOS)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: target/release/${{ env.BINARY_NAME }}
          retention-days: 30

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: target/release/${{ env.BINARY_NAME }}.exe
          retention-days: 30

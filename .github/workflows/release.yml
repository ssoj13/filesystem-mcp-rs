name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: filesystem-mcp-rs

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: filesystem-mcp-rs-linux-x86_64.zip
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: filesystem-mcp-rs-macos-aarch64.zip
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: filesystem-mcp-rs-windows-x86_64.zip
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb1-dev \
            libxrandr-dev \
            libx11-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libwayland-dev \
            libpipewire-0.3-dev \
            libegl-dev \
            libdrm-dev \
            libgbm-dev \
            libclang-dev

      - name: Build release binary
        run: cargo build --target ${{ matrix.target }} --release

      - name: macOS code signing
        if: runner.os == 'macOS'
        uses: ./.github/actions/macos-code-sign
        with:
          target: ${{ matrix.target }}
          apple-certificate: ${{ secrets.APPLE_CERTIFICATE }}
          apple-certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          apple-id: ${{ secrets.APPLE_ID }}
          apple-password: ${{ secrets.APPLE_PASSWORD }}
          apple-team-id: ${{ secrets.APPLE_TEAM_ID }}

      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p release
          cp target/${{ matrix.target }}/release/${{ env.BINARY_NAME }} release/
          chmod +x release/${{ env.BINARY_NAME }}
          cd release && zip ../${{ matrix.asset }} ${{ env.BINARY_NAME }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release
          Copy-Item "target\${{ matrix.target }}\release\${{ env.BINARY_NAME }}.exe" release\
          Compress-Archive -Path release\* -DestinationPath ${{ matrix.asset }}

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.asset }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: dist/**/*.zip

[package]
name = "agent-chat"
version = "0.1.0"
edition = "2024"
description = "Live chat between agents on one machine: a shared SQLite channel and the rules around it."
license = "MIT"
publish = false

[lib]
path = "src/agent_chat.rs"

[dependencies]
anyhow = "1.0.104"
# The same version as the server: only one crate in a build may link the bundled SQLite.
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.39"
tokio = { version = "1.53.2", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }

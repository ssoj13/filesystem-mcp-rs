[package]
name = "fscan-rs"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Streaming filesystem traversal for indexers and tree consumers"
readme = "README.md"

[dependencies]
anyhow = "1"
crossbeam-channel = "0.5"
log = "0.4"
walkdir = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_Foundation", "Win32_Security"] }

[dev-dependencies]
tempfile = "3"

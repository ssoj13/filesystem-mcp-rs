[package]
name = "locate-rs"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Shared, coalescing filesystem name index for local processes"

[dependencies]
anyhow = "1"
fscan-rs = { path = "../vendor/fscan-rs" }
globset = "0.4"
regex = "1"
rusqlite = { version = "0.40", features = ["bundled", "functions", "hooks"] }
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
